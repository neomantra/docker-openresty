server {
    listen 8080;
    location /smoke {
        content_by_lua_block {
            local ffi = require("ffi")
            local function check_integer(ctype, value, expected)
                local cast = tonumber(ffi.cast(ctype, value))
                assert(cast == expected,
                    "ffi.cast " .. ctype .. ": " .. tostring(cast)
                    .. " != " .. tostring(expected))
                local new = tonumber(ffi.new(ctype, value))
                assert(new == expected,
                    "ffi.new " .. ctype .. ": " .. tostring(new)
                    .. " != " .. tostring(expected))
            end

            -- openresty/openresty#1152: PPC64 number-to-integer conversions
            -- returned zero. Fractions also exercise the double conversion
            -- path on dual-number builds. Do not use ipairs to drive these
            -- checks: the regression also affected integer table keys.
            local function check_conversions(value, expected)
                check_integer("int32_t", value, expected)
                check_integer("uint32_t", value, expected)
                check_integer("int64_t", value, expected)
                check_integer("uint64_t", value, expected)
                check_integer("intptr_t", value, expected)
            end
            check_conversions(123456789, 123456789)
            check_conversions(123456789.75, 123456789)
            check_integer("int64_t", -123456789.75, -123456789)
            check_integer("int64_t", 4294967297, 4294967297)
            check_integer("uint64_t", 4294967297, 4294967297)
            assert(tostring(ffi.cast("int64_t", -2^63)) == "-9223372036854775808LL",
                "signed 64-bit boundary conversion failed")
            assert(tostring(ffi.cast("uint64_t", 2^63)) == "9223372036854775808ULL",
                "unsigned 64-bit boundary conversion failed")
            assert(#{1, 2, 3} == 3, "integer table length regression")
            assert(string.format("%d", 123456789.75) == "123456789",
                "integer formatting regression")

            -- Check regex availability separately from numeric conversions.
            assert(ngx.re, "ngx.re is unavailable")
            local match, err = ngx.re.match("smoke123", "([0-9]+)", "jo")
            assert(match, err or "regex did not match")
            assert(match[1] == "123", "regex capture regression")

            ngx.log(ngx.ERR, "openresty-smoke-error")
            ngx.say("openresty-smoke-lua:", 6 * 7)
        }
    }
}
