name: Build entrypoint variant
description: Derive an entrypoint image from a base digest and test it before publishing tags
inputs:
  image:
    description: Primary registry image name
    required: true
  digest:
    description: Digest of the base image built by this job
    required: true
  flavor:
    description: Base flavor name, including fat/debug/valgrind suffixes
    required: true
  arch:
    description: Architecture tag suffix
    required: true
  platform:
    description: Docker platform
    required: true
  mirror-image:
    description: Mirror registry image name
    required: true
  mirror-enabled:
    description: Whether to publish to the mirror
    default: 'false'
runs:
  using: composite
  steps:
    - name: Select executable and prefix
      id: flavor
      shell: bash
      env:
        BASE_FLAVOR: ${{ inputs.flavor }}
      run: |
        case "$BASE_FLAVOR" in
          bookworm-debug) variant=-debug ;;
          bookworm-valgrind) variant=-valgrind ;;
          *) variant= ;;
        esac
        echo "command=openresty${variant}" >> "$GITHUB_OUTPUT"
        echo "prefix=/usr/local/openresty${variant}" >> "$GITHUB_OUTPUT"

    - name: Extract entrypoint metadata
      id: meta
      uses: ./.github/actions/image-metadata
      with:
        image: ${{ inputs.image }}
        flavor: ${{ inputs.flavor }}-entrypoint
        arch: ${{ inputs.arch }}

    - name: Build and push candidate digest
      id: build
      uses: docker/build-push-action@v7
      with:
        context: .
        file: entrypoint/Dockerfile
        platforms: ${{ inputs.platform }}
        build-args: |
          RESTY_ENTRYPOINT_BASE=${{ inputs.image }}@${{ inputs.digest }}
          RESTY_ENTRYPOINT_COMMAND=${{ steps.flavor.outputs.command }}
          RESTY_PREFIX=${{ steps.flavor.outputs.prefix }}
        labels: ${{ steps.meta.outputs.labels }}
        outputs: type=image,name=${{ inputs.image }},push-by-digest=true,name-canonical=true,push=true

    - name: Test and publish entrypoint tags
      shell: bash
      env:
        SOURCE: ${{ inputs.image }}@${{ steps.build.outputs.digest }}
        FLAVOR: ${{ inputs.flavor }}
        TAGS: ${{ steps.meta.outputs.tags }}
        PRIMARY_IMAGE: ${{ inputs.image }}
        MIRROR_IMAGE: ${{ inputs.mirror-image }}
        MIRROR_ENABLED: ${{ inputs.mirror-enabled }}
        SMOKE_PLATFORM: ${{ inputs.platform }}
      run: bash scripts/test-and-publish.sh "$SOURCE" "$FLAVOR" entrypoint
