# Builds and publishes the OpenResty Docker image matrix
#
# Copyright (c) 2026 Evan Wies 
#
#
# env:
#   GHCR_IMAGE: GitHub Container Registry image
#   DOCKERHUB_IMAGE: Docker Hub image
#
# secrets:
#   GHCR_USERNAME: GitHub Container Registry username
#   GHCR_PASSWORD: GitHub Container Registry password
#   DOCKERHUB_USERNAME: Docker Hub username
#   DOCKERHUB_PASSWORD: Docker Hub password
#

name: Docker Build and Publish

on:
  push:
    branches:
      - master
    tags:
      - '*'
  workflow_dispatch:

env:
  GHCR_IMAGE: ${{ vars.GHCR_IMAGE || format('ghcr.io/{0}/openresty', github.repository_owner) }}
  DOCKERHUB_REGISTRY: ${{ vars.DOCKERHUB_REGISTRY || 'docker.io' }}
  DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE || 'docker.io/openresty/openresty' }}

permissions:
  contents: read
  packages: write

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      base: ${{ steps.matrix.outputs.base }}
      fat: ${{ steps.matrix.outputs.fat }}
      base-flavors: ${{ steps.matrix.outputs.base-flavors }}
      fat-flavors: ${{ steps.matrix.outputs.fat-flavors }}
    steps:
      - uses: actions/checkout@v6
      - id: matrix
        run: |
          {
            echo "base=$(jq -c '.base' .github/build-matrix.json)"
            echo "fat=$(jq -c '.fat' .github/build-matrix.json)"
            echo "base-flavors=$(jq -c '{flavor: [.base.include[].flavor] | unique}' .github/build-matrix.json)"
            echo "fat-flavors=$(jq -c '{flavor: [.fat.include[].flavor] | unique}' .github/build-matrix.json)"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.base) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_PASSWORD }}

      - name: Login to Docker Mirror
        if: vars.ENABLE_DOCKERHUB_MIRROR == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.DOCKERHUB_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: ./.github/actions/image-metadata
        with:
          image: ${{ env.GHCR_IMAGE }}
          flavor: ${{ matrix.flavor }}
          arch: ${{ matrix.arch }}

      - name: Build candidate digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          build-args: ${{ matrix.build-args }}
          outputs: type=image,name=${{ env.GHCR_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}

      - name: Test and publish standard image
        env:
          SOURCE: ${{ env.GHCR_IMAGE }}@${{ steps.build.outputs.digest }}
          PRIMARY_IMAGE: ${{ env.GHCR_IMAGE }}
          TAGS: ${{ steps.meta.outputs.tags }}
          MIRROR_IMAGE: ${{ env.DOCKERHUB_IMAGE }}
          MIRROR_ENABLED: ${{ vars.ENABLE_DOCKERHUB_MIRROR }}
          SMOKE_PLATFORM: ${{ matrix.platforms }}
          FLAVOR: ${{ matrix.flavor }}
        run: bash scripts/test-and-publish.sh "$SOURCE" "$FLAVOR" standard

      - name: Build and publish entrypoint variant
        uses: ./.github/actions/build-entrypoint
        with:
          image: ${{ env.GHCR_IMAGE }}
          digest: ${{ steps.build.outputs.digest }}
          flavor: ${{ matrix.flavor }}
          arch: ${{ matrix.arch }}
          platform: ${{ matrix.platforms }}
          mirror-image: ${{ env.DOCKERHUB_IMAGE }}
          mirror-enabled: ${{ vars.ENABLE_DOCKERHUB_MIRROR }}

  manifest:
    needs: [matrix, build]
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJSON(needs.matrix.outputs.base-flavors) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_PASSWORD }}

      - name: Login to Docker Hub (Mirror)
        if: vars.ENABLE_DOCKERHUB_MIRROR == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.DOCKERHUB_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Create and Push Manifest
        run: ./scripts/create-manifest.sh "${{ matrix.flavor }}" "${{ env.GHCR_IMAGE }}" "${{ env.DOCKERHUB_IMAGE }}" "${{ vars.ENABLE_DOCKERHUB_MIRROR }}"


      - name: Create and Push Entrypoint Manifest
        run: ./scripts/create-manifest.sh "${{ matrix.flavor }}-entrypoint" "${{ env.GHCR_IMAGE }}" "${{ env.DOCKERHUB_IMAGE }}" "${{ vars.ENABLE_DOCKERHUB_MIRROR }}"

  build-fat:
    needs: [matrix, manifest]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.fat) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_PASSWORD }}

      - name: Login to Docker Hub (Mirror)
        if: vars.ENABLE_DOCKERHUB_MIRROR == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.DOCKERHUB_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Determine Fat Base Image
        id: fat-base
        env:
          BASE_FLAVOR: ${{ matrix.base_flavor }}
        run: |
          echo "RESTY_FAT_IMAGE_TAG=$(bash scripts/fat-base-tag.sh "$BASE_FLAVOR")" >> "$GITHUB_ENV"
          echo "RESTY_FAT_IMAGE_BASE=$GHCR_IMAGE" >> "$GITHUB_ENV"

      - name: Extract metadata
        id: meta
        uses: ./.github/actions/image-metadata
        with:
          image: ${{ env.GHCR_IMAGE }}
          flavor: ${{ matrix.flavor }}
          arch: ${{ matrix.arch }}

      - name: Build candidate digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          outputs: type=image,name=${{ env.GHCR_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            RESTY_FAT_IMAGE_BASE=${{ env.RESTY_FAT_IMAGE_BASE }}
            RESTY_FAT_IMAGE_TAG=${{ env.RESTY_FAT_IMAGE_TAG }}

      - name: Test and publish standard image
        env:
          SOURCE: ${{ env.GHCR_IMAGE }}@${{ steps.build.outputs.digest }}
          PRIMARY_IMAGE: ${{ env.GHCR_IMAGE }}
          TAGS: ${{ steps.meta.outputs.tags }}
          MIRROR_IMAGE: ${{ env.DOCKERHUB_IMAGE }}
          MIRROR_ENABLED: ${{ vars.ENABLE_DOCKERHUB_MIRROR }}
          SMOKE_PLATFORM: ${{ matrix.platforms }}
          FLAVOR: ${{ matrix.flavor }}
        run: bash scripts/test-and-publish.sh "$SOURCE" "$FLAVOR" standard

      - name: Build and publish entrypoint variant
        uses: ./.github/actions/build-entrypoint
        with:
          image: ${{ env.GHCR_IMAGE }}
          digest: ${{ steps.build.outputs.digest }}
          flavor: ${{ matrix.flavor }}
          arch: ${{ matrix.arch }}
          platform: ${{ matrix.platforms }}
          mirror-image: ${{ env.DOCKERHUB_IMAGE }}
          mirror-enabled: ${{ vars.ENABLE_DOCKERHUB_MIRROR }}

